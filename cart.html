<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Apurva Adornment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
<div class="page-hero">
  <h1>Your Seva Basket</h1>
  <p>Review your adornments before checkout — every order is blessed before dispatch.</p>
  <div class="crumbs"><a href="index.html">Home</a> / Cart</div>
</div>

<section>
  <div class="container">
    <div id="cart-view"></div>
  </div>
</section>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
let coupon = 0;
function pageInit(){ render(); }

function render(){
  const cart = store.cart;
  const view = document.getElementById("cart-view");

  if(!cart.length){
    view.innerHTML = `<div class="empty">
      <div class="big">🛒</div>
      <p><b>Your basket is empty.</b><br>Adorn your deity with something beautiful.</p>
      <a class="btn btn-gold" href="shop.html" style="margin-top:1.2rem">Browse Collection</a>
    </div>`;
    return;
  }

  const lines = cart.map((l,i)=>{
    const p = PRODUCTS.find(x=>x.id===l.id); if(!p) return "";
    return `<div class="cart-item">
      <a class="art" href="product.html?id=${p.id}">${productArt(p,"c"+i)}</a>
      <div>
        <a href="product.html?id=${p.id}"><h4>${p.name}</h4></a>
        <div class="meta">${p.deity} · Size: ${l.size}</div>
        <div class="qty">
          <button onclick="chQty(${i},-1)" aria-label="Decrease">−</button><span>${l.qty}</span><button onclick="chQty(${i},1)" aria-label="Increase">+</button>
        </div>
      </div>
      <div class="right">
        <span class="price">${fmt(p.price*l.qty)}</span>
        <button class="rm-btn" onclick="rmLine(${i})">Remove</button>
      </div>
    </div>`;
  }).join("");

  const sub = cart.reduce((s,l)=>{ const p=PRODUCTS.find(x=>x.id===l.id); return s + (p?p.price*l.qty:0); },0);
  const ship = sub >= 999 ? 0 : 79;
  const disc = Math.round(sub*coupon);
  const total = sub - disc + ship;

  view.innerHTML = `<div class="cart-layout">
    <div>${lines}
      <a class="btn btn-outline" href="shop.html" style="margin-top:.4rem">← Continue Shopping</a>
    </div>
    <div class="summary-card">
      <h3 style="color:var(--maroon-800);font-size:1.35rem;margin-bottom:1rem">Order Summary</h3>
      <div class="sum-row"><span>Subtotal</span><b>${fmt(sub)}</b></div>
      <div class="sum-row"><span>Shipping</span><b>${ship===0?'<span style="color:var(--teal)">FREE</span>':fmt(ship)}</b></div>
      ${disc?`<div class="sum-row"><span>Coupon (SEVA10)</span><b style="color:var(--teal)">− ${fmt(disc)}</b></div>`:""}
      <div class="sum-row" style="border-bottom:none;font-size:1rem;margin-top:.4rem"><span><b>Total</b></span><b style="color:var(--maroon-800);font-size:1.2rem">${fmt(total)}</b></div>
      ${sub<999?`<small style="color:var(--muted);font-size:.72rem">Add ${fmt(999-sub)} more for free shipping 🚚</small>`:""}
      <div class="coupon-row">
        <input id="coupon" placeholder="Coupon code (try SEVA10)" aria-label="Coupon code">
        <button class="btn btn-outline btn-sm" onclick="applyCoupon()">Apply</button>
      </div>
      <button class="btn btn-gold btn-block" onclick="checkout()" style="margin-top:.4rem">🙏 Proceed to Checkout</button>
      <div class="trust-row" style="margin-top:1rem">
        <div class="trust"><span>🔒</span>Secure payment</div>
        <div class="trust"><span>📿</span>Blessed & packed</div>
        <div class="trust"><span>↩️</span>Easy exchange</div>
      </div>
    </div>
  </div>`;
}

function chQty(i,d){ const c=store.cart; c[i].qty=Math.max(1,Math.min(10,c[i].qty+d)); store.cart=c; render(); }
function rmLine(i){ const c=store.cart; c.splice(i,1); store.cart=c; render(); toast("Removed from basket"); }
function applyCoupon(){
  const v = document.getElementById("coupon").value.trim().toUpperCase();
  if(v==="SEVA10"){ coupon=.10; toast("🎉 SEVA10 applied — 10% off!"); }
  else { coupon=0; toast("Invalid coupon code"); }
  render();
}
function checkout(){
  const view = document.getElementById("cart-view");
  store.cart = [];
  view.innerHTML = `<div class="empty">
    <div class="big">🪔</div>
    <h2 style="color:var(--maroon-800);font-size:2rem;margin-bottom:.6rem">Order Placed — Jay Shree Swaminarayan!</h2>
    <p>This is a demo checkout. Your order <b>#AA-${Math.floor(10000+Math.random()*899)}</b> would now be blessed, packed & dispatched.<br>A confirmation would be sent via WhatsApp & email.</p>
    <div style="display:flex;gap:.8rem;justify-content:center;margin-top:1.4rem;flex-wrap:wrap">
      <a class="btn btn-gold" href="account.html">Track in My Account</a>
      <a class="btn btn-outline" href="shop.html">Continue Shopping</a>
    </div>
  </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
